services:
  # Main Django application
  web:
    build: .
    container_name: cct-web
    networks:
      - default
      - proxy
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - .:/app  # Mount current directory for development
    environment:
      - DEBUG=${DEBUG:-0}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-*&v#&okfzv%-wgvm#q=&qgif1l)vr5gg11i_^fh%bw#+3pu7&!}
      - DATABASE_URL=postgresql://arcom:${DB_PASSWORD:-Ferizaj2024!}@db:5432/arcom
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,ambienti.scardustech.com}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-https://ambienti.scardustech.com}
      - DB_PASSWORD=${DB_PASSWORD:-Ferizaj2024!}
      - USE_TLS=${USE_TLS:-True}
      # Fallback map center (used only when a scope has no geolocated points).
      - MAP_DEFAULT_LAT=${MAP_DEFAULT_LAT:-42.37092943416372}
      - MAP_DEFAULT_LNG=${MAP_DEFAULT_LNG:-20.435394872814765}
      - MAP_DEFAULT_ZOOM=${MAP_DEFAULT_ZOOM:-14}
    depends_on:
      - db
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000  # Development server
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Database
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=arcom
      - POSTGRES_USER=arcom
      - POSTGRES_PASSWORD=${DB_PASSWORD:-Ferizaj2024!}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arcom"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cron job for daily maintenance
  cron:
    build:
      context: .
      dockerfile: ./docker/cron/Dockerfile
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    environment:
      - DEBUG=${DEBUG:-0}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-*&v#&okfzv%-wgvm#q=&qgif1l)vr5gg11i_^fh%bw#+3pu7&!}
      - DATABASE_URL=postgresql://arcom:${DB_PASSWORD:-Ferizaj2024!}@db:5432/arcom
      - DB_PASSWORD=${DB_PASSWORD:-Ferizaj2024!}
    depends_on:
      - db
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  proxy:
    external: true
    name: scarduspage_proxy