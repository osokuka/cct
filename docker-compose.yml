version: '3.8'

services:
  # Main Django application
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - static_volume:/app/static
      - media_volume:/app/media
    environment:
      - DEBUG=1
      - DATABASE_URL=sqlite:///db.sqlite3
    depends_on:
      - db
    command: python manage.py runserver 0.0.0.0:8000

  # Database
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=arcom
      - POSTGRES_USER=arcom
      - POSTGRES_PASSWORD=arcom

  # Cron job for daily maintenance
  cron:
    build: ./docker/cron
    volumes:
      - .:/app
      - cron_logs:/var/log
    environment:
      - DEBUG=1
      - DATABASE_URL=sqlite:///db.sqlite3
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume:
  media_volume:
  cron_logs:
