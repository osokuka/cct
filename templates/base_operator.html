<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#111827">
    <title>{% block title %}Field Operator{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>window.FontAwesomeConfig = { autoReplaceSvg: 'nest'};</script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" crossorigin="anonymous"></script>
    <style>
        html, body { -webkit-tap-highlight-color: transparent; }
        body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen">
<header class="sticky top-0 z-30 bg-gray-900 text-white px-4 py-3 flex items-center justify-between shadow">
    <div class="min-w-0">
        <div class="text-[11px] uppercase tracking-wider text-gray-400">Field operator</div>
        <div class="font-semibold truncate">{% block header_title %}Collection{% endblock %}</div>
    </div>
    <div class="flex items-center gap-3 text-sm">
        <span class="text-gray-300 truncate max-w-[7rem]">{{ user.username }}</span>
        <a href="{% url 'accounts:logout' %}" class="text-gray-400 hover:text-white" title="Logout">
            <i class="fa-solid fa-right-from-bracket"></i>
        </a>
    </div>
</header>

<main class="max-w-lg mx-auto px-3 py-3 pb-24">
    {% if messages %}
    <div class="space-y-2 mb-3">
        {% for message in messages %}
        <div class="rounded-lg px-3 py-2 text-sm {% if message.tags == 'error' %}bg-red-100 text-red-800{% elif message.tags == 'success' %}bg-emerald-100 text-emerald-800{% else %}bg-blue-100 text-blue-800{% endif %}">
            {{ message }}
        </div>
        {% endfor %}
    </div>
    {% endif %}
    {% block content %}{% endblock %}
</main>

<nav class="fixed bottom-0 inset-x-0 bg-white border-t border-gray-200 safe-bottom z-30">
    <div class="max-w-lg mx-auto grid grid-cols-3 text-center text-xs">
        <a href="{% url 'accounts:barcode_scanner' %}#scan"
           class="py-3 {% if request.resolver_match.url_name == 'barcode_scanner' %}text-gray-900 font-semibold{% else %}text-gray-500{% endif %}">
            <i class="fa-solid fa-qrcode text-lg block mb-0.5"></i>Scan
        </a>
        <a href="{% url 'accounts:barcode_scanner' %}#todo"
           class="py-3 text-gray-500 hover:text-gray-900">
            <i class="fa-solid fa-list text-lg block mb-0.5"></i>To do
        </a>
        <a href="{% url 'accounts:barcode_scanner' %}#done"
           class="py-3 text-gray-500 hover:text-gray-900">
            <i class="fa-solid fa-circle-check text-lg block mb-0.5"></i>Done
        </a>
    </div>
</nav>

{% block extra_js %}{% endblock %}
</body>
</html>
