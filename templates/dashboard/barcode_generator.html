{% extends 'base.html' %}
{% load static %}

{% block title %}Barcode Generator - Admin Dashboard{% endblock %}

{% block content %}
<div class="container mx-auto px-4 lg:px-6 py-6">
    <!-- Header -->
    <div class="mb-8">
        <h1 class="heading-font font-bold text-3xl text-dark-graphite uppercase tracking-wider">
            <i class="fa-solid fa-barcode mr-3"></i>
            Barcode Generator
        </h1>
        <p class="text-gray-600 mt-2">Generate and manage barcodes for room identification</p>
    </div>

    <!-- Room Selection -->
    <div class="bg-white rounded-lg shadow-lg border border-gray-200 mb-8">
        <div class="px-6 py-4 border-b border-gray-200">
            <h2 class="heading-font font-bold text-xl text-dark-graphite uppercase tracking-wider">
                <i class="fa-solid fa-list mr-2"></i>
                Room Selection
            </h2>
        </div>
        <div class="p-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Camp</label>
                    <select id="camp-filter" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-steel-blue focus:border-transparent">
                        <option value="">All Camps</option>
                        {% for camp in camps %}
                        <option value="{{ camp.id }}">{{ camp.name }} ({{ camp.code }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Compound</label>
                    <select id="compound-filter" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-steel-blue focus:border-transparent">
                        <option value="">All Compounds</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Building</label>
                    <select id="building-filter" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-steel-blue focus:border-transparent">
                        <option value="">All Buildings</option>
                    </select>
                </div>
            </div>
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">Search Rooms</label>
                <input type="text" id="room-search" placeholder="Search by room name or code..." class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-steel-blue focus:border-transparent">
            </div>
            <div class="flex space-x-4 mb-6">
                <button id="select-all-btn" class="px-4 py-2 bg-blue-600 text-white rounded-lg font-bold uppercase tracking-wider hover:bg-blue-700 transition-all duration-200">
                    <i class="fa-solid fa-check-double mr-2"></i>
                    Select All
                </button>
                <button id="deselect-all-btn" class="px-4 py-2 bg-gray-600 text-white rounded-lg font-bold uppercase tracking-wider hover:bg-gray-700 transition-all duration-200">
                    <i class="fa-solid fa-times mr-2"></i>
                    Deselect All
                </button>
                <button id="filter-rooms-btn" class="px-4 py-2 bg-green-600 text-white rounded-lg font-bold uppercase tracking-wider hover:bg-green-700 transition-all duration-200">
                    <i class="fa-solid fa-filter mr-2"></i>
                    Apply Filters
                </button>
            </div>
        </div>
    </div>

    <!-- Room List -->
    <div class="bg-white rounded-lg shadow-lg border border-gray-200 mb-8">
        <div class="px-6 py-4 border-b border-gray-200">
            <h2 class="heading-font font-bold text-xl text-dark-graphite uppercase tracking-wider">
                <i class="fa-solid fa-door-open mr-2"></i>
                Rooms
            </h2>
        </div>
        <div class="p-6">
            <div id="rooms-container" class="space-y-2 max-h-96 overflow-y-auto">
                <!-- Rooms will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Barcode Generation Options -->
    <div class="bg-white rounded-lg shadow-lg border border-gray-200 mb-8">
        <div class="px-6 py-4 border-b border-gray-200">
            <h2 class="heading-font font-bold text-xl text-dark-graphite uppercase tracking-wider">
                <i class="fa-solid fa-cog mr-2"></i>
                Generation Options
            </h2>
        </div>
        <div class="p-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Barcode Format</label>
                    <select id="barcode-format" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-steel-blue focus:border-transparent">
                        <option value="code128">Code128</option>
                        <option value="code39">Code39</option>
                        <option value="ean13">EAN13</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Output Format</label>
                    <select id="output-format" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-steel-blue focus:border-transparent">
                        <option value="png">PNG Images</option>
                        <option value="pdf">PDF Document</option>
                        <option value="svg">SVG Vector</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Barcode Size</label>
                    <select id="barcode-size" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-steel-blue focus:border-transparent">
                        <option value="small">Small (100x50)</option>
                        <option value="medium" selected>Medium (200x100)</option>
                        <option value="large">Large (400x200)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Include Text</label>
                    <select id="include-text" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-steel-blue focus:border-transparent">
                        <option value="true" selected>Yes</option>
                        <option value="false">No</option>
                    </select>
                </div>
            </div>
            <div class="flex space-x-4">
                <button id="preview-barcode-btn" class="px-6 py-3 bg-yellow-600 text-white rounded-lg font-bold uppercase tracking-wider hover:bg-yellow-700 transition-all duration-200">
                    <i class="fa-solid fa-eye mr-2"></i>
                    Preview Barcode
                </button>
                <button id="generate-barcodes-btn" class="px-6 py-3 bg-green-600 text-white rounded-lg font-bold uppercase tracking-wider hover:bg-green-700 transition-all duration-200">
                    <i class="fa-solid fa-barcode mr-2"></i>
                    Generate Barcodes
                </button>
                <button id="regenerate-barcodes-btn" class="px-6 py-3 bg-blue-600 text-white rounded-lg font-bold uppercase tracking-wider hover:bg-blue-700 transition-all duration-200">
                    <i class="fa-solid fa-refresh mr-2"></i>
                    Regenerate All
                </button>
            </div>
        </div>
    </div>

    <!-- Barcode Preview -->
    <div id="barcode-preview" class="hidden">
        <div class="bg-white rounded-lg shadow-lg border border-gray-200 mb-8">
            <div class="px-6 py-4 border-b border-gray-200">
                <h2 class="heading-font font-bold text-xl text-dark-graphite uppercase tracking-wider">
                    <i class="fa-solid fa-eye mr-2"></i>
                    Barcode Preview
                </h2>
            </div>
            <div id="preview-content" class="p-6">
                <!-- Preview will be shown here -->
            </div>
        </div>
    </div>

    <!-- Generation Results -->
    <div id="generation-results" class="hidden">
        <div class="bg-white rounded-lg shadow-lg border border-gray-200">
            <div class="px-6 py-4 border-b border-gray-200">
                <h2 class="heading-font font-bold text-xl text-dark-graphite uppercase tracking-wider">
                    <i class="fa-solid fa-check-circle mr-2"></i>
                    Generation Results
                </h2>
            </div>
            <div id="results-content" class="p-6">
                <!-- Results will be shown here -->
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Load initial rooms
    loadRooms();

    // Filter change handlers
    document.getElementById('camp-filter').addEventListener('change', function() {
        loadCompounds(this.value);
        loadBuildings('');
    });

    document.getElementById('compound-filter').addEventListener('change', function() {
        loadBuildings(this.value);
    });

    // Room selection handlers
    document.getElementById('select-all-btn').addEventListener('click', function() {
        document.querySelectorAll('.room-checkbox').forEach(checkbox => {
            checkbox.checked = true;
        });
    });

    document.getElementById('deselect-all-btn').addEventListener('click', function() {
        document.querySelectorAll('.room-checkbox').forEach(checkbox => {
            checkbox.checked = false;
        });
    });

    document.getElementById('filter-rooms-btn').addEventListener('click', function() {
        loadRooms();
    });

    // Barcode generation handlers
    document.getElementById('preview-barcode-btn').addEventListener('click', function() {
        const selectedRooms = getSelectedRooms();
        if (selectedRooms.length === 0) {
            alert('Please select at least one room');
            return;
        }

        if (selectedRooms.length > 1) {
            alert('Please select only one room for preview');
            return;
        }

        previewBarcode(selectedRooms[0]);
    });

    document.getElementById('generate-barcodes-btn').addEventListener('click', function() {
        const selectedRooms = getSelectedRooms();
        if (selectedRooms.length === 0) {
            alert('Please select at least one room');
            return;
        }

        generateBarcodes(selectedRooms);
    });

    document.getElementById('regenerate-barcodes-btn').addEventListener('click', function() {
        if (!confirm('Are you sure you want to regenerate all barcodes? This will overwrite existing barcodes.')) {
            return;
        }

        const selectedRooms = getSelectedRooms();
        if (selectedRooms.length === 0) {
            alert('Please select at least one room');
            return;
        }

        regenerateBarcodes(selectedRooms);
    });
});

function loadRooms() {
    const campId = document.getElementById('camp-filter').value;
    const compoundId = document.getElementById('compound-filter').value;
    const buildingId = document.getElementById('building-filter').value;
    const search = document.getElementById('room-search').value;

    const params = new URLSearchParams();
    if (campId) params.append('camp_id', campId);
    if (compoundId) params.append('compound_id', compoundId);
    if (buildingId) params.append('building_id', buildingId);
    if (search) params.append('search', search);

    fetch(`/admin/barcode/rooms/?${params}`)
    .then(response => response.json())
    .then(data => {
        const container = document.getElementById('rooms-container');
        if (data.rooms && data.rooms.length > 0) {
            container.innerHTML = data.rooms.map(room => `
                <div class="flex items-center justify-between p-3 bg-gray-50 border border-gray-200 rounded-lg">
                    <div class="flex items-center">
                        <input type="checkbox" class="room-checkbox mr-3" value="${room.id}" data-room-code="${room.code}">
                        <div>
                            <div class="font-medium text-gray-900">${room.name}</div>
                            <div class="text-sm text-gray-600">${room.hierarchy_path}</div>
                            <div class="text-sm text-gray-500">Code: ${room.code}</div>
                        </div>
                    </div>
                    <div class="text-right">
                        <div class="text-sm text-gray-600">${room.sqm} m²</div>
                        <div class="text-sm text-gray-500">
                            ${room.barcode_data ? '<span class="text-green-600">Barcode exists</span>' : '<span class="text-red-600">No barcode</span>'}
                        </div>
                    </div>
                </div>
            `).join('');
        } else {
            container.innerHTML = '<p class="text-gray-500 text-center py-8">No rooms found</p>';
        }
    })
    .catch(error => {
        console.error('Error loading rooms:', error);
    });
}

function loadCompounds(campId) {
    const select = document.getElementById('compound-filter');
    select.innerHTML = '<option value="">All Compounds</option>';
    
    if (!campId) return;

    fetch(`/admin/barcode/compounds/?camp_id=${campId}`)
    .then(response => response.json())
    .then(data => {
        data.compounds.forEach(compound => {
            const option = document.createElement('option');
            option.value = compound.id;
            option.textContent = compound.name;
            select.appendChild(option);
        });
    })
    .catch(error => {
        console.error('Error loading compounds:', error);
    });
}

function loadBuildings(compoundId) {
    const select = document.getElementById('building-filter');
    select.innerHTML = '<option value="">All Buildings</option>';
    
    if (!compoundId) return;

    fetch(`/admin/barcode/buildings/?compound_id=${compoundId}`)
    .then(response => response.json())
    .then(data => {
        data.buildings.forEach(building => {
            const option = document.createElement('option');
            option.value = building.id;
            option.textContent = building.name;
            select.appendChild(option);
        });
    })
    .catch(error => {
        console.error('Error loading buildings:', error);
    });
}

function getSelectedRooms() {
    const selected = [];
    document.querySelectorAll('.room-checkbox:checked').forEach(checkbox => {
        selected.push({
            id: checkbox.value,
            code: checkbox.dataset.roomCode
        });
    });
    return selected;
}

function previewBarcode(room) {
    const format = document.getElementById('barcode-format').value;
    const size = document.getElementById('barcode-size').value;
    const includeText = document.getElementById('include-text').value === 'true';

    const previewData = {
        room_id: room.id,
        room_code: room.code,
        format: format,
        size: size,
        include_text: includeText
    };

    fetch('/admin/barcode/preview/', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
        },
        body: JSON.stringify(previewData)
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            displayPreview(data.barcode_data, room.code);
        } else {
            alert('Error: ' + data.error);
        }
    })
    .catch(error => {
        alert('Error: ' + error.message);
    });
}

function generateBarcodes(rooms) {
    const format = document.getElementById('barcode-format').value;
    const outputFormat = document.getElementById('output-format').value;
    const size = document.getElementById('barcode-size').value;
    const includeText = document.getElementById('include-text').value === 'true';

    const generationData = {
        room_ids: rooms.map(r => r.id),
        format: format,
        output_format: outputFormat,
        size: size,
        include_text: includeText
    };

    fetch('/admin/barcode/generate/', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
        },
        body: JSON.stringify(generationData)
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            displayResults(data.result);
            if (data.download_url) {
                // Create download link
                const link = document.createElement('a');
                link.href = data.download_url;
                link.download = data.filename;
                link.click();
            }
        } else {
            alert('Error: ' + data.error);
        }
    })
    .catch(error => {
        alert('Error: ' + error.message);
    });
}

function regenerateBarcodes(rooms) {
    const format = document.getElementById('barcode-format').value;
    const outputFormat = document.getElementById('output-format').value;
    const size = document.getElementById('barcode-size').value;
    const includeText = document.getElementById('include-text').value === 'true';

    const generationData = {
        room_ids: rooms.map(r => r.id),
        format: format,
        output_format: outputFormat,
        size: size,
        include_text: includeText,
        regenerate: true
    };

    fetch('/admin/barcode/regenerate/', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
        },
        body: JSON.stringify(generationData)
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            displayResults(data.result);
            if (data.download_url) {
                // Create download link
                const link = document.createElement('a');
                link.href = data.download_url;
                link.download = data.filename;
                link.click();
            }
        } else {
            alert('Error: ' + data.error);
        }
    })
    .catch(error => {
        alert('Error: ' + error.message);
    });
}

function displayPreview(barcodeData, roomCode) {
    const previewSection = document.getElementById('barcode-preview');
    const previewContent = document.getElementById('preview-content');
    
    previewContent.innerHTML = `
        <div class="text-center">
            <h3 class="text-lg font-bold text-gray-900 mb-4">Preview for Room: ${roomCode}</h3>
            <div class="inline-block p-4 bg-white border border-gray-300 rounded-lg">
                <img src="data:image/png;base64,${barcodeData}" alt="Barcode Preview" class="max-w-full h-auto">
            </div>
        </div>
    `;
    
    previewSection.classList.remove('hidden');
}

function displayResults(result) {
    const resultsSection = document.getElementById('generation-results');
    const resultsContent = document.getElementById('results-content');
    
    let html = `
        <div class="mb-6">
            <h3 class="text-lg font-bold text-green-900 mb-4">Barcode Generation Complete!</h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                <div class="bg-green-50 border border-green-200 rounded-lg p-4">
                    <div class="text-2xl font-bold text-green-600">${result.generated}</div>
                    <div class="text-sm text-green-800">Barcodes Generated</div>
                </div>
                <div class="bg-yellow-50 border border-yellow-200 rounded-lg p-4">
                    <div class="text-2xl font-bold text-yellow-600">${result.skipped}</div>
                    <div class="text-sm text-yellow-800">Barcodes Skipped</div>
                </div>
                <div class="bg-red-50 border border-red-200 rounded-lg p-4">
                    <div class="text-2xl font-bold text-red-600">${result.errors}</div>
                    <div class="text-sm text-red-800">Errors</div>
                </div>
            </div>
        </div>
    `;
    
    if (result.error_details && result.error_details.length > 0) {
        html += `
            <div class="mb-6">
                <h4 class="font-bold text-red-900 mb-3">Errors:</h4>
                <div class="space-y-2">
                    ${result.error_details.map(error => `
                        <div class="flex items-center justify-between p-3 bg-red-50 border border-red-200 rounded-lg">
                            <div class="text-red-800">
                                Room ${error.room_code}: ${error.error}
                            </div>
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
    }
    
    resultsContent.innerHTML = html;
    resultsSection.classList.remove('hidden');
}
</script>
{% endblock %}
