{% extends 'base.html' %}
{% load static %}

{% block title %}SLA Management{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-100 p-6">
    <div class="max-w-7xl mx-auto">
        <div class="bg-white rounded-lg shadow-lg">
            <div class="px-6 py-4 border-b border-gray-200">
                <h3 class="text-lg font-semibold text-gray-900 flex items-center">
                    <i class="fas fa-chart-line mr-2 text-blue-600"></i>
                    SLA Management & Calculations
                </h3>
            </div>
            <div class="p-6">
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                    <div>
                        <label for="campSelect" class="block text-sm font-medium text-gray-700 mb-1">Site</label>
                        <select id="campSelect" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="">Select a camp</option>
                            {% for camp in camps %}
                            <option value="{{ camp.id }}">{{ camp.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label for="startDate" class="block text-sm font-medium text-gray-700 mb-1">Start Date</label>
                        <input type="date" id="startDate" value="{{ current_date|date:'Y-m-d' }}" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label for="endDate" class="block text-sm font-medium text-gray-700 mb-1">End Date</label>
                        <input type="date" id="endDate" value="{{ current_date|date:'Y-m-d' }}" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">&nbsp;</label>
                        <button id="calculateWeeklyBtn" class="w-full bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 flex items-center justify-center">
                            <i class="fas fa-calculator mr-1"></i>Calculate Weekly SLA
                        </button>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                    <div>
                        <label for="monthSelect" class="block text-sm font-medium text-gray-700 mb-1">Month (for Monthly SLA)</label>
                        <input type="month" id="monthSelect" value="{{ current_date|date:'Y-m' }}" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">&nbsp;</label>
                        <button id="calculateMonthlyBtn" class="w-full bg-cyan-600 text-white px-4 py-2 rounded-md hover:bg-cyan-700 focus:outline-none focus:ring-2 focus:ring-cyan-500 flex items-center justify-center">
                            <i class="fas fa-chart-bar mr-1"></i>Calculate Monthly SLA
                        </button>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">&nbsp;</label>
                        <button id="generateRollupBtn" class="w-full bg-green-600 text-white px-4 py-2 rounded-md hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-500 flex items-center justify-center">
                            <i class="fas fa-database mr-1"></i>Generate Monthly Rollup
                        </button>
                    </div>
                </div>

                <div id="results" class="mt-6" style="display: none;">
                    <!-- Results will be displayed here -->
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const campSelect = document.getElementById('campSelect');
    const startDate = document.getElementById('startDate');
    const endDate = document.getElementById('endDate');
    const monthSelect = document.getElementById('monthSelect');
    const calculateWeeklyBtn = document.getElementById('calculateWeeklyBtn');
    const calculateMonthlyBtn = document.getElementById('calculateMonthlyBtn');
    const generateRollupBtn = document.getElementById('generateRollupBtn');
    const resultsDiv = document.getElementById('results');

    calculateWeeklyBtn.addEventListener('click', function() {
        calculateSLA('weekly');
    });

    calculateMonthlyBtn.addEventListener('click', function() {
        calculateSLA('monthly');
    });

    generateRollupBtn.addEventListener('click', function() {
        generateRollup();
    });

    function calculateSLA(type) {
        const campId = campSelect.value;
        if (!campId) {
            alert('Please select a camp');
            return;
        }

        const formData = new FormData();
        formData.append('action', `calculate_${type}`);
        formData.append('camp_id', campId);

        if (type === 'weekly') {
            formData.append('start_date', startDate.value);
            formData.append('end_date', endDate.value);
        } else {
            formData.append('month', monthSelect.value);
        }

        // Show loading state
        const btn = type === 'weekly' ? calculateWeeklyBtn : calculateMonthlyBtn;
        const originalText = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i>Calculating...';
        btn.disabled = true;

        fetch('{% url "dashboard:sla_calculation_api" %}', {
            method: 'POST',
            body: formData,
            headers: {
                'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
            }
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                displaySLAResults(data, type);
            } else {
                showError(data.error);
            }
        })
        .catch(error => {
            showError('An error occurred: ' + error.message);
        })
        .finally(() => {
            btn.innerHTML = originalText;
            btn.disabled = false;
        });
    }

    function generateRollup() {
        const campId = campSelect.value;
        const month = monthSelect.value;
        
        if (!campId) {
            alert('Please select a camp');
            return;
        }
        
        if (!month) {
            alert('Please select a month');
            return;
        }

        const formData = new FormData();
        formData.append('action', 'generate_rollup');
        formData.append('camp_id', campId);
        formData.append('month', month);

        // Show loading state
        const originalText = generateRollupBtn.innerHTML;
        generateRollupBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i>Generating...';
        generateRollupBtn.disabled = true;

        fetch('{% url "dashboard:sla_calculation_api" %}', {
            method: 'POST',
            body: formData,
            headers: {
                'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
            }
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                showSuccess(`Monthly rollup generated successfully! Created ${data.created_count} records for ${data.period}`);
            } else {
                showError(data.error);
            }
        })
        .catch(error => {
            showError('An error occurred: ' + error.message);
        })
        .finally(() => {
            generateRollupBtn.innerHTML = originalText;
            generateRollupBtn.disabled = false;
        });
    }

    function displaySLAResults(data, type) {
        let html = '<div class="bg-white rounded-lg shadow-lg">';
        html += '<div class="px-6 py-4 border-b border-gray-200"><h5 class="text-lg font-semibold text-gray-900">SLA Results</h5></div>';
        html += '<div class="p-6">';

        // Summary
        html += '<div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">';
        html += '<div class="bg-blue-600 text-white rounded-lg p-4 text-center">';
        html += `<h4 class="text-2xl font-bold">${data.summary.total_required_sqm.toFixed(2)}</h4><small class="text-blue-100">Required SQM</small>`;
        html += '</div>';
        html += '<div class="bg-green-600 text-white rounded-lg p-4 text-center">';
        html += `<h4 class="text-2xl font-bold">${data.summary.total_achieved_sqm.toFixed(2)}</h4><small class="text-green-100">Achieved SQM</small>`;
        html += '</div>';
        html += '<div class="bg-cyan-600 text-white rounded-lg p-4 text-center">';
        html += `<h4 class="text-2xl font-bold">${data.summary.overall_sla_percent.toFixed(1)}%</h4><small class="text-cyan-100">Overall SLA</small>`;
        html += '</div>';
        
        if (type === 'monthly' && data.summary.total_capped_sqm !== undefined) {
            html += '<div class="bg-yellow-600 text-white rounded-lg p-4 text-center">';
            html += `<h4 class="text-2xl font-bold">${data.summary.total_capped_sqm.toFixed(2)}</h4><small class="text-yellow-100">Capped SQM</small>`;
            html += '</div>';
        }
        html += '</div>';

        // Detailed results table
        html += '<div class="overflow-x-auto">';
        html += '<table class="min-w-full divide-y divide-gray-200">';
        html += '<thead class="bg-gray-50">';
        html += '<tr>';
        html += '<th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Service Point</th>';
        html += '<th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Zone</th>';
        html += '<th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Street</th>';
        html += '<th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Required SQM</th>';
        html += '<th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Achieved SQM</th>';
        if (type === 'monthly') {
            html += '<th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Capped SQM</th>';
            html += '<th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Overage</th>';
        }
        html += '<th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">SLA %</th>';
        html += '</tr></thead><tbody class="bg-white divide-y divide-gray-200">';

        data.sla_data.forEach(item => {
            html += '<tr class="hover:bg-gray-50">';
            html += `<td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${item.room}</td>`;
            html += `<td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${item.compound}</td>`;
            html += `<td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${item.building}</td>`;
            html += `<td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${item.required_sqm.toFixed(2)}</td>`;
            html += `<td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${item.achieved_sqm.toFixed(2)}</td>`;
            if (type === 'monthly') {
                html += `<td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${item.capped_sqm.toFixed(2)}</td>`;
                html += `<td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${item.overage.toFixed(2)}</td>`;
            }
            const slaClass = item.sla_percent >= 100 ? 'text-green-600' : item.sla_percent >= 80 ? 'text-yellow-600' : 'text-red-600';
            html += `<td class="px-6 py-4 whitespace-nowrap text-sm font-medium ${slaClass}">${item.sla_percent.toFixed(1)}%</td>`;
            html += '</tr>';
        });

        html += '</tbody></table></div>';
        html += '</div></div>';
        
        resultsDiv.innerHTML = html;
        resultsDiv.style.display = 'block';
    }

    function showSuccess(message) {
        resultsDiv.innerHTML = `
            <div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded flex items-center">
                <i class="fas fa-check-circle mr-2"></i>${message}
            </div>
        `;
        resultsDiv.style.display = 'block';
    }

    function showError(message) {
        resultsDiv.innerHTML = `
            <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded flex items-center">
                <i class="fas fa-exclamation-circle mr-2"></i>${message}
            </div>
        `;
        resultsDiv.style.display = 'block';
    }
});
</script>
{% endblock %}
